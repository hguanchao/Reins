<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f9fafb" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
		<link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<title>Reins</title>
		<script>
			// 首帧之前定好主题，避免界面先闪一帧错误的底色；默认跟随系统
			(() => {
				let mode = "system";
				try {
					const stored = localStorage.getItem("reins-theme");
					if (stored === "zai-light" || stored === "zai-dark" || stored === "system") mode = stored;
				} catch {
					// 存储不可用时保持默认的跟随系统
				}
				const dark =
					mode === "zai-dark" ||
					(mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.dataset.theme = dark ? "zai-dark" : "zai-light";
				document.documentElement.classList.toggle("dark", dark);
				document
					.querySelector('meta[name="theme-color"]')
					?.setAttribute("content", dark ? "#1b1b1c" : "#f9fafb");
				// 桌面壳使用原生标题栏覆盖，页面给标题栏让出 40px
				if (window.reinsDesktop !== undefined) {
					document.documentElement.dataset.windowsTitlebar = "";
					document.documentElement.style.setProperty("--caption-height", "40px");
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
