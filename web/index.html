<!doctype html>
<html lang="zh-CN" data-theme="zai-dark" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#161616" />
		<title>Reins</title>
		<script>
			// 首帧之前定好主题，避免深色界面先闪一帧白底
			try {
				const mode = localStorage.getItem("reins-theme") || "zai-dark";
				const dark =
					mode === "zai-dark" ||
					(mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.dataset.theme = dark ? "zai-dark" : "zai-light";
				document.documentElement.classList.toggle("dark", dark);
				document
					.querySelector('meta[name="theme-color"]')
					?.setAttribute("content", dark ? "#161616" : "#f8f8f8");
			} catch {
				// 读不到 localStorage 时沿用 html 上的默认深色
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
